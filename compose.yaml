name: lunarwindow

services:
  api:
    image: lunarwindow-api:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'
    environment:
      LUNARWINDOW_CORS_ORIGINS: '${LUNARWINDOW_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}'
      LUNARWINDOW_PRECOMPUTED_DIR: '${LUNARWINDOW_PRECOMPUTED_DIR-/app/data/releases/lunarwindow-demo-v1/bundle}'
      LUNARWINDOW_CACHE_MAX_ENTRIES: '${LUNARWINDOW_CACHE_MAX_ENTRIES-32}'
      LUNARWINDOW_CACHE_MAX_BYTES: '${LUNARWINDOW_CACHE_MAX_BYTES-16777216}'
      UVICORN_LIMIT_CONCURRENCY: '${LUNARWINDOW_API_MAX_CONCURRENCY:-16}'
      UVICORN_TIMEOUT_KEEP_ALIVE: '${LUNARWINDOW_API_KEEP_ALIVE_SECONDS:-5}'
    mem_limit: '${LUNARWINDOW_API_MEMORY_LIMIT:-1g}'
    cpus: '${LUNARWINDOW_API_CPUS:-2.0}'
    init: true
    restart: unless-stopped

  web:
    image: lunarwindow-web:local
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_BASE_URL: 'http://localhost:${API_PORT:-8000}'
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  ephemeris:
    image: lunarwindow-ephemeris:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: ephemeris
    profiles: ['tools']
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    environment:
      LUNARWINDOW_LOCK_DIR: /app/data/raw/.locks
    volumes:
      - ./data:/app/data
    init: true

  terrain:
    image: lunarwindow-terrain:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: terrain
    profiles: ['tools']
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    volumes:
      - ./data:/app/data
    init: true

  validate:
    image: lunarwindow-ephemeris:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: ephemeris
    profiles: ['tools']
    entrypoint: ['lunarwindow-validate']
    volumes:
      - ./data:/app/data:ro
    init: true

  report:
    image: lunarwindow-report:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: analysis
    profiles: ['tools']
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    volumes:
      - ./data:/app/data
      - ./docs/validation:/app/docs/validation:ro
    init: true

  ephemeris-test:
    image: lunarwindow-ephemeris-test:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    profiles: ['test']
    init: true
