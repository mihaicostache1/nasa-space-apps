name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build container images
        run: docker compose --profile tools --profile test build
      - name: Run offline backend tests in Docker
        run: docker compose run --rm ephemeris-test
      - name: Build GIS-enabled custom-coordinate test image
        run: docker build --target custom-test -f backend/Dockerfile -t lunarwindow-custom-test .
      - name: Exercise custom-coordinate evaluation with GIS dependencies and no network
        run: docker run --rm --network none --entrypoint python lunarwindow-custom-test -m unittest discover -s /app/tests -p 'test_custom_*.py' -v
      - name: Measure custom acquisition, terrain generation, and admission recovery
        run: python3 scripts/load_test_custom.py --image lunarwindow-custom-test --profile smoke --requests 2 --output /tmp/lunarwindow-custom-load-smoke.json
      - name: Upload custom API load-test measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-api-load-smoke
          path: /tmp/lunarwindow-custom-load-smoke.json
      - name: Verify the packaged data release and saved API responses
        run: docker compose run --rm -T --entrypoint python api - < scripts/check_packaged_release.py
      - name: Smoke-test API load paths and resource bounds
        run: python3 scripts/load_test_api.py --requests 2 --concurrency 1 2 --with-healthcheck --output /tmp/lunarwindow-load-smoke.json
      - name: Upload API load-test measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-load-smoke
          path: /tmp/lunarwindow-load-smoke.json
      - name: Validate the reference dataset handoff
        run: docker compose run --rm validate data/reference/validation-30d
      - name: Generate the reference pointing report
        run: docker compose run --rm --user "$(id -u):$(id -g)" report data/reference/validation-30d --quickmap-results docs/validation/quickmap-results.json
      - name: Check the export CLI
        run: |
          docker compose run --rm ephemeris --sites data/sites.example.json --start 2026-11-14T00:00:00Z --end 2026-11-15T00:00:00Z --dry-run > /tmp/lunarwindow-requests.json
          python3 -c "import json; d=json.load(open('/tmp/lunarwindow-requests.json')); assert d['samplesPerSite'] == 24 and d['requests'] == 2"
      - name: Start and verify the web and API images
        run: |
          docker compose up -d --wait --wait-timeout 90 web api
          curl --fail --silent --show-error http://127.0.0.1:8000/api/health | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['status'] == 'ok' and d['dataMode'] == 'synthetic'"
          curl --fail --silent --show-error http://127.0.0.1:8000/api/ready | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['status'] == 'ready' and d['referenceSiteCount'] == 3 and d['precomputedJobCount'] == 4"
          curl --fail --silent --show-error http://127.0.0.1:8000/api/sites/demo-polar-a | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['schemaVersion'] == 'lunarwindow.evaluation.v2' and d['metrics']['evaluatedHrs'] == 720 and 'both' in d['windows']"
          curl --fail --silent --show-error http://127.0.0.1:8000/api/reference/sites/lola-site01-reference/ephemeris | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['schemaVersion'] == 'lunarwindow.ephemeris.v2' and len(d['series']) == 720 and d['provenance']['provider'] == 'NASA/JPL Horizons'"
          curl --fail --silent --show-error http://127.0.0.1:8000/api/reference/sites | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['schemaVersion'] == 'lunarwindow.reference-catalog.v1' and len(d['sites']) == 3 and all(s['availability']['stepMinutes'] == 60 and s['availability']['sampleCount'] == 720 for s in d['sites'])"
          curl --fail --silent --show-error 'http://127.0.0.1:8000/api/reference/sites/lola-site01-reference/ephemeris?startUtc=2026-11-15T00:00:00Z&endUtc=2026-11-16T00:00:00Z&stepMinutes=120' | python3 -c "import json,sys; d=json.load(sys.stdin); assert len(d['series']) == 12 and d['provenance']['stepMinutes'] == 120 and d['series'][-1]['t'] == '2026-11-15T22:00:00Z'"
          curl --fail --silent --show-error http://127.0.0.1:8000/api/reference/evaluations -H 'Content-Type: application/json' -d '{"siteId":"lola-site23-reference","horizonMode":"geometric","startUtc":"2026-11-14T00:00:00Z","endUtc":"2026-11-15T00:00:00Z"}' | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['dataMode'] == 'reference' and d['horizonMode'] == 'geometric' and d['metrics']['evaluatedHrs'] == 24 and d['provenance']['archive']['sampleCount'] == 720 and d['provenance']['ephemeris']['provider'] == 'NASA/JPL Horizons'"
          curl --fail --silent --show-error http://127.0.0.1:8000/api/reference/evaluations -H 'Content-Type: application/json' -d '{"siteId":"lola-site01-reference","horizonMode":"terrain","maskId":"lola-site01-reference-mast-0m","allowMeanEarthApproximation":true,"startUtc":"2026-11-14T00:00:00Z","endUtc":"2026-11-15T00:00:00Z"}' | python3 -c "import json,sys; d=json.load(sys.stdin); t=d['provenance']['terrain']; assert d['schemaVersion'] == 'lunarwindow.reference-evaluation.v2' and d['horizonMode'] == 'terrain' and d['metrics']['evaluatedHrs'] == 24 and t['artifactSha256'] == '4554c4dd492b59f57d30e2de8cecb33d84714da5248f98acefdb8abccc446f6d' and t['compatibility']['frameStatus'] == 'approximate' and t['compatibility']['transformationApplied'] is False and d['horizon'] == t['mask']['horizon']"
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health | python3 -c "import json,sys; assert json.load(sys.stdin)['status'] == 'ok'"
          curl --fail --silent --show-error http://127.0.0.1:3000/ -o /tmp/lunarwindow-page.html
          python3 -c "from pathlib import Path; page = Path('/tmp/lunarwindow-page.html').read_text(); assert 'Every landing' in page and 'Loading verified reference sites' in page"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix /tmp/lunarwindow-browser --no-audit --no-fund playwright@1.65.1
          /tmp/lunarwindow-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Rehearse deployed web and API in Chromium
        env:
          NODE_PATH: /tmp/lunarwindow-browser/node_modules
        run: node scripts/check_deployed_app.mjs
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down
  ephemeris:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e './backend[dev]'
      - run: python -m ruff check backend scripts
      - run: python -m ruff format --check backend scripts
      - run: python -m unittest discover -s backend/tests -v
      - run: python -m unittest discover -s scripts/tests -v
      - name: Verify every reviewed terrain registration against the archive
        run: python -m lunarwindow.terrain.handoff registered --reference-dir data/reference/validation-30d --terrain-dir data/reference/terrain-masks --allow-mean-earth-approximation
      - run: python scripts/validate_quickmap.py
      - name: Replay surface SPICE evidence and shared-horizon model comparisons
        run: python scripts/validate_surface_science.py --output data/processed/surface-science-ci.json
      - name: Upload surface scientific comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-science-${{ matrix.os }}-${{ matrix.python-version }}
          path: data/processed/surface-science-ci.json
      - name: Rebuild and compare the pinned demo data release
        run: python -m lunarwindow.precompute.release check data/releases/lunarwindow-demo-v1 --reference-dir data/reference/validation-30d
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
