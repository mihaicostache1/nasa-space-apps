name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build container images
        run: docker compose --profile tools --profile test build
      - name: Run offline ephemeris tests in Docker
        run: docker compose run --rm ephemeris-test
      - name: Check the export CLI
        run: |
          docker compose run --rm ephemeris --sites data/sites.example.json --start 2026-11-14T00:00:00Z --end 2026-11-15T00:00:00Z --dry-run > /tmp/lunarwindow-requests.json
          python3 -c "import json; d=json.load(open('/tmp/lunarwindow-requests.json')); assert d['samplesPerSite'] == 24 and d['requests'] == 2"
      - name: Start and verify the web image
        run: |
          docker compose up -d --wait --wait-timeout 90 web
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health | python3 -c "import json,sys; assert json.load(sys.stdin)['status'] == 'ok'"
          curl --fail --silent --show-error http://127.0.0.1:3000/ -o /tmp/lunarwindow-page.html
          python3 -c "from pathlib import Path; assert 'Comparison workspace' in Path('/tmp/lunarwindow-page.html').read_text()"
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down
  ephemeris:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ./backend
      - run: python -m unittest discover -s backend/tests -v
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
