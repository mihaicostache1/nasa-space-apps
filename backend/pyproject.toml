[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunarwindow-ephemeris"
version = "0.2.0"
description = "LunarWindow API and traceable Sun/Earth ephemeris tools"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "jsonschema>=4.23,<5",
    "numpy>=2.0,<3",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "ruff>=0.14,<1"]
analysis = ["matplotlib>=3.10,<4"]
gis = ["pyshp>=2.3,<4", "rasterio>=1.4,<2"]

[project.scripts]
lunarwindow-ephemeris = "lunarwindow.ephemeris.cli:main"
lunarwindow-report = "lunarwindow.ephemeris.report:main"
lunarwindow-validate = "lunarwindow.ephemeris.contract:main"
lunarwindow-terrain = "lunarwindow.terrain.cli:main"
lunarwindow-precompute = "lunarwindow.precompute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lunarwindow.ephemeris" = ["*.schema.json"]
"lunarwindow.terrain" = ["*.schema.json"]
"lunarwindow.precompute" = ["*.schema.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
